<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" href="/favicon.ico" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>✦ paradox | shoot 'em up</title>
        <meta property="og:type" content="website" />
        <meta property="og:url" content="https://paradox-game.io/" />
        <meta property="og:title" content="Paradox" />
        <meta property="og:description" content="A retro shoot 'em up by Thomas Thorstensson" />
        <meta name="description" content="A retro shoot 'em up by Thomas Thorstensson" />
        <meta property="og:image" content="https://paradox-game.io/OG.png" />
        <meta name="twitter:card" content="summary_large_image" />
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="/style.css" />

        <!-- Phones and iPads get only the mobile message: no loader, no game
             (Thomas, 2026-11-16). Runs before the page draws. -->
        <script>
            (function () {
                const isiPad = /Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints && navigator.maxTouchPoints > 1;
                const isiPadLegacy = /iPad/i.test(navigator.userAgent);
                const isAnyiPad = isiPad || isiPadLegacy;
                const isPhone = /Android|iPhone|iPod/i.test(navigator.userAgent);

                if (isAnyiPad || isPhone) {
                    document.documentElement.classList.add("mobile");
                }
            })();
        </script>
    </head>

    <body>
        <p id="mobile-text"><span data-nosnippet>Hello. There were no C64 mobiles. Revisit from a desktop screen to play!</span></p>

        <!-- The loader (Thomas, 2026-11-16), C64 style: the text top left,
             the splash centred, until the game has loaded (src/loader.js). -->
        <div id="loader">
            <p id="loader-text">Loading Paradox <span id="loader-percent">0</span>%.<br>Headphones recommended.<span id="loader-ready" hidden><br>READY.<br>Click to RUN<span id="loader-cursor"></span></span></p>
            <img id="loader-splash" src="/src/assets/splash/splash.png" alt="" />
        </div>

        <!-- The splash at the game's zoom: the largest whole multiple of
             1280x800 that fits the window, as main.js integerZoom(). -->
        <script>
            (function () {
                function setZoom() {
                    const zoom = Math.max(1, Math.floor(Math.min(innerWidth / 1280, innerHeight / 800)));
                    document.documentElement.style.setProperty("--zoom", zoom);
                }

                setZoom();
                addEventListener("resize", setZoom);
            })();
        </script>

        <div id="app">
            <div id="phaser-container"></div>
        </div>

        <span id="by-link" data-nosnippet><a href="https://github.com/thorstensson" target="_blank" rel="noopener">Github</a> | <a href="https://www.thomasthorstensson.com" target="_blank" rel="noopener">Folio</a></span>
        <script type="module" src="/src/main.js"></script>
    </body>
</html>
